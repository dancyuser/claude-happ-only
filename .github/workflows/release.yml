name: Validate and package Windows installer
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source line endings and run checks
        shell: powershell
        run: |
          ./Initialize-Payload.ps1
          ./tests/Static-Checks.ps1
      - name: Build installer
        shell: powershell
        run: ./Build-Release.ps1 -OutputDirectory "$env:RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ runner.temp }}/package/*
  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ${{ runner.temp }}/package
      - name: Publish versioned installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $tag = 'v' + $version
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; bump VERSION instead of replacing it" }
          gh release create $tag "$env:RUNNER_TEMP/package/Claude-Happ-Universal.zip" "$env:RUNNER_TEMP/package/Claude-Happ-Universal.zip.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Claude Happ $tag" --notes-file RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
